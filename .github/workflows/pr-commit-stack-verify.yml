name: PR Commit Stack Verify

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-only changes
        id: detect
        run: |
          echo "docs_only=$(bash ./scripts/ci/docs_only.sh \
            '${{ github.event.pull_request.base.sha }}' \
            '${{ github.event.pull_request.head.sha }}')" >> "$GITHUB_OUTPUT"

  enumerate-commits:
    name: Enumerate Non-Head PR Commits
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.docs_only != 'true' }}
    outputs:
      has_commits: ${{ steps.enumerate.outputs.has_commits }}
      matrix_json: ${{ steps.enumerate.outputs.matrix_json }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build commit matrix (exclude PR head)
        id: enumerate
        run: |
          bash ./scripts/ci/list_pr_non_head_commits.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            >> "$GITHUB_OUTPUT"

  verify-linux-per-commit:
    name: Linux per-commit (${{ matrix.short }})
    runs-on: ubuntu-latest
    needs: enumerate-commits
    if: ${{ needs.enumerate-commits.outputs.has_commits == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.enumerate-commits.outputs.matrix_json) }}
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile and test (Android/shared/web)
        run: bash ./scripts/ci/verify_linux.sh

  verify-macos-per-commit:
    name: macOS per-commit (${{ matrix.short }})
    runs-on: macos-latest
    needs: enumerate-commits
    if: ${{ needs.enumerate-commits.outputs.has_commits == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.enumerate-commits.outputs.matrix_json) }}
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native (.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: iOS Kotlin/Native compile smoke
        run: bash ./scripts/ci/verify_macos_ios_smoke.sh

  pr-commit-stack-verify:
    name: PR Commit Stack Verify
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - enumerate-commits
      - verify-linux-per-commit
      - verify-macos-per-commit
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evaluate per-commit verification results
        env:
          DOCS_ONLY: ${{ needs.detect-changes.outputs.docs_only }}
          DETECT_CHANGES_RESULT: ${{ needs.detect-changes.result }}
          HAS_COMMITS: ${{ needs.enumerate-commits.outputs.has_commits }}
          ENUMERATE_RESULT: ${{ needs.enumerate-commits.result }}
          LINUX_RESULT: ${{ needs.verify-linux-per-commit.result }}
          MACOS_RESULT: ${{ needs.verify-macos-per-commit.result }}
        run: bash ./scripts/ci/evaluate_pr_stack_results.sh
